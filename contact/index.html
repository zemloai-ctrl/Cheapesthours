<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | CheapestHours</title>
  <meta name="description" content="Contact CheapestHours.com with questions, feedback, or corrections.">
  <link rel="canonical" href="https://cheapesthours.com/contact/">

  <meta name="robots" content="index,follow">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="theme-color" content="#17213B">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1192222195357366"
     crossorigin="anonymous"></script>

  <style>
    :root {
      --navy:#17213B; --deep:#0D1526; --gold:#D4A24C; --cream:#F5ECDC;
      --ink:#1B2A4A; --soft:rgba(27,42,74,.64);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh;
      font-family:"Inter",sans-serif;
      color:var(--cream);
      background:radial-gradient(ellipse at 50% -10%,#2a3c69 0%,var(--navy) 43%,var(--deep) 100%);
    }
    main {
      width:min(100% - 36px,480px);
      margin:auto;
      padding:36px 0 60px;
      text-align:center;
    }
    .brand {
      font-family:"Fraunces",serif;
      color:var(--gold);
      font-size:21px;
      font-weight:650;
      text-decoration:none;
    }
    h1 {
      font-family:"Fraunces",serif;
      font-size:28px;
      margin:24px 0 10px;
    }
    .lead {
      color:rgba(245,236,220,.66);
      font-size:13.5px;
      line-height:1.6;
      margin:0 0 26px;
    }
    .card {
      background:var(--cream);
      color:var(--ink);
      border-radius:21px;
      padding:28px 24px;
      box-shadow:0 22px 65px rgba(0,0,0,.34);
      text-align:left;
    }
    .card h2 {
      font-family:"Fraunces",serif;
      font-size:17px;
      margin:0 0 6px;
    }
    .card p {
      font-size:13.5px;
      line-height:1.65;
      margin:0 0 20px;
    }
    .email-link {
      display:block;
      text-align:center;
      padding:14px;
      border-radius:12px;
      text-decoration:none;
      background:linear-gradient(135deg,var(--gold),#C08A38);
      color:var(--ink);
      font-family:"Fraunces",serif;
      font-weight:700;
      font-size:15px;
    }
    .back {
      display:inline-block;
      margin-top:26px;
      color:var(--cream);
      opacity:.7;
      text-decoration:none;
      font-size:12.5px;
    }
  </style>
</head>
<body>
<main>
  <a class="brand" href="/">⚡ CheapestHours</a>

  <h1>Contact</h1>
  <p class="lead">
    Questions, feedback, or spotted something wrong with the data? Get in touch.
  </p>

  <div class="card">
    <h2>Email us</h2>
    <p>
      For general questions, feedback, corrections, or advertising and
      partnership inquiries, email us directly and we'll get back to you.
    </p>
    <a class="email-link" href="mailto:sakke@elecz.com">sakke@elecz.com</a>
  </div>

  <a class="back" href="/">← Back to CheapestHours</a>
</main>
</body>
</html>
